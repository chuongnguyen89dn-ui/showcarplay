name: Apply Bluetooth clean-shutdown fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bluetooth-clean-shutdown
          fetch-depth: 0

      - name: Apply Bluetooth cleanup to source
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("source/carplay_bt.m")
          s = p.read_text()

          marker = 'int main(int argc, char *argv[]) {'
          if s.count(marker) != 1:
              raise SystemExit("main anchor not unique")

          restore = r'''
          static volatile sig_atomic_t shutdown_requested = 0;

          static void showcase_signal_handler(int sig) {
              (void)sig;
              shutdown_requested = 1;
          }

          static void restore_system_bluetooth(void) {
              printf("[BT] clean shutdown: returning controller to iOS\n");
              if (active_cid) {
                  bt_send_cmd(&hci_disconnect, active_cid, 0x13);
                  active_cid = 0;
                  usleep(150000);
              }
              bt_send_cmd(&btstack_set_discoverable, 0);
              bt_send_cmd(&btstack_set_power_mode, 0);
              usleep(200000);
              bt_send_cmd(&btstack_set_system_bluetooth_enabled, 1);
              unlink(BT_READY_PATH);
              unlink(BT_ID_PATH);
              int fd = open(BT_DOWN_PATH, O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (fd >= 0) close(fd);
          }

          '''

          if "static volatile sig_atomic_t shutdown_requested" not in s:
              pos = s.index(marker)
              s = s[:pos] + restore + s[pos:]

          old = marker
          new = '''int main(int argc, char *argv[]) {
              signal(SIGTERM, showcase_signal_handler);
              signal(SIGINT, showcase_signal_handler);
              signal(SIGHUP, showcase_signal_handler);'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit("main anchor missing after insertion")

          old_loop = "        run_loop_execute();\n    }\n    return 0;"
          new_loop = "        run_loop_execute();\n        restore_system_bluetooth();\n    }\n    return 0;"
          if s.count(old_loop) != 1:
              raise SystemExit("run loop anchor not unique")
          s = s.replace(old_loop, new_loop, 1)

          p.write_text(s)
      - name: Validate source change
        run: |
          grep -n "showcase_signal_handler\|restore_system_bluetooth\|clean shutdown" source/carplay_bt.m
          grep -n "signal(SIGTERM" source/carplay_bt.m
          grep -n "run_loop_execute" source/carplay_bt.m

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/carplay_bt.m
          git diff --cached --check
          git commit -m "fix(bt): restore system Bluetooth on receiver shutdown"
          git push origin HEAD:fix/bluetooth-clean-shutdown
