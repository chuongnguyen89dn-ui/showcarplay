name: Apply Bluetooth clean-shutdown fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bluetooth-clean-shutdown
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          git apply --check PATCHES/bluetooth-clean-shutdown.patch
          git apply PATCHES/bluetooth-clean-shutdown.patch

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/carplay_bt.m
          git commit -m "fix(bt): restore system Bluetooth on receiver shutdown"
          git push origin HEAD:fix/bluetooth-clean-shutdown
